name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lfcs.json
        run: python3 -c "import json;d=json.load(open('data/lfcs.json'));assert len(d['weeks']['items'])==12;print('lfcs.json valid,',len(d['weeks']['items']),'weeks')"
      - name: Every week has a lab guide
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open('data/lfcs.json'))
          missing = [w['id'] for w in d['weeks']['items']
                     if not os.path.exists('lab/%s.html' % w['id'])]
          if missing:
              print('::error::missing lab guides: %s' % missing); sys.exit(1)
          print('all 12 lab guides present')
          PY
      - name: Scope check — no Windows-only tooling
        run: |
          if grep -rniE '\b(azure|powershell|wsl2?|rufus)\b' \
              --include='*.html' --include='*.css' --include='*.js' --include='*.json' \
              --exclude-dir='.git' . ; then
            echo "::error::Out-of-scope platform content found."
            exit 1
          fi
          echo "Clean."

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
